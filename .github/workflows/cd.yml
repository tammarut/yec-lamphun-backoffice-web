name: CD

# This workflow is the DEV publisher: it builds and pushes the Docker image to
# GHCR tagged `:latest`, then tells the dev Dokploy application to pull and
# deploy it. Production is published separately by release.yml (on a `vX.Y.Z`
# git tag) and advanced by a manual tag bump in Dokploy — see ADR-0025.
#
# CD publishes only after CI has completed successfully ON MAIN. The
# `workflow_run` trigger fires whenever the "CI" workflow finishes — including
# CI runs from PR pushes — so both jobs gate on BOTH
# `workflow_run.conclusion == "success"` AND `workflow_run.head_branch == "main"`.
# A failing lint/test/build never produces a publishable image, and neither
# does a passing PR run: workflow_run events execute in the default-branch
# context, so without the branch check a PR's image would be tagged `:latest`
# — the exact mutable tag the dev Dokploy app deploys (tag hijack). The branch
# condition is load-bearing; do not remove it.
#
# The deploy step triggers Dokploy but does NOT wait for the rollout: Dokploy
# queues the deploy and cd.yml's job ends when the trigger returns.
# See docs/adr/0004-cd-image-publishing-via-ghcr.md and
# docs/adr/0025-dev-latest-auto-deploy-prod-version-tag.md for the rationale.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

permissions:
    contents: read
    packages: write

concurrency:
    # Key on the verified commit. A new push supersedes an in-flight build of
    # the same commit; distinct commits build independently.
    group: cd-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

jobs:
    build-and-push:
        name: Build Docker image and push to registry
        runs-on: ubuntu-latest
        env:
            R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        # Only publish when the CI run that triggered us actually succeeded AND
        # ran on main (a merge). PR pushes run CI too, but their completions
        # must never publish — see the header comment for the tag-hijack risk.
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
        steps:
            - name: Checkout (the commit CI verified)
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  # Never let the action mint a `latest` on its own — the only
                  # `latest` this workflow publishes is the explicit main-branch
                  # rule below. (metadata-action's default flavor auto-adds
                  # `latest` for semver/tag refs, which would move the dev
                  # deploy pointer; see ADR-0025.)
                  flavor: |
                      latest=false
                  tags: |
                      # main branch → "latest" tag (the dev Dokploy app tracks
                      # and pulls this). The `head_branch == 'main'` gate above
                      # already limits us to merges; `is_default_branch` keeps
                      # the tag self-documenting if the trigger ever changes.
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Runner env does not reach the Docker build: next.config.ts
                  # reads R2_PUBLIC_BASE_URL while building (CSP img-src), so
                  # it must be passed explicitly as a build-arg.
                  build-args: |
                      R2_PUBLIC_BASE_URL=${{ vars.R2_PUBLIC_BASE_URL }}

    deploy:
        name: Trigger dev deploy in Dokploy
        runs-on: ubuntu-latest
        needs: build-and-push
        # Same gate as the build: only a CI-verified merge to main deploys.
        # `build-and-push` already encodes this, but repeating it keeps the
        # deploy job's intent explicit and self-contained.
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
        # Serialize deploys: two merges in quick succession must not race to
        # restart the same dev container. A single constant group means the
        # second deploy waits for the first rather than canceling it.
        concurrency:
            group: dokploy-dev-deploy
            cancel-in-progress: false
        steps:
            # Dokploy's built-in auto-deploy does not listen to GHCR pushes, so
            # the workflow must trigger the deploy explicitly. Uses the
            # documented API method (POST /api/application.deploy with the
            # x-api-key header) rather than the per-app Deploy Webhook URL.
            #
            # CREDENTIAL SCOPE: unlike the per-app webhook URL (which can only
            # trigger one application), a Dokploy API key is scoped to the whole
            # instance — it can drive any Dokploy API call. Treat
            # DOKPLOY_API_KEY as a high-value secret.
            #
            # KNOWN LIMITATION: the panel's Cloudflare zone has Bot Fight Mode
            # enabled, which challenges this runner's datacenter IP (ASN 8075,
            # Microsoft/Azure) and returns 403 for a plain curl. Both this API
            # path and the old webhook path sit behind that same zone, so the
            # switch itself does not defeat it. The trigger needs a path
            # Cloudflare does not gate. The diagnostic below surfaces the
            # status/body instead of swallowing it behind `-f`.
            - name: Trigger Dokploy dev deploy
              env:
                  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
                  DOKPLOY_APP_ID: ${{ vars.DOKPLOY_APP_ID }}
                  DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
              run: |
                  set -euo pipefail
                  http_code=$(curl -sS -o /tmp/dokploy-body -w '%{http_code}' \
                    --location --request POST "$DOKPLOY_URL/api/application.deploy" \
                    --header "x-api-key: $DOKPLOY_API_KEY" \
                    --header "Content-Type: application/json" \
                    --data-raw "{\"applicationId\":\"$DOKPLOY_APP_ID\"}")
                  echo "HTTP $http_code"
                  echo "--- response body ---"
                  cat /tmp/dokploy-body
                  if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                    echo "::error::Dokploy deploy trigger failed with HTTP $http_code"
                    exit 1
                  fi

    cleanup:
        name: Cleanup Old Docker Images
        runs-on: ubuntu-latest
        needs: build-and-push
        permissions:
            packages: write
        steps:
            # Pinned to v1.2.2 (commit d52806a). SHA-pinned per GitHub security
            # guidance: a floating tag (@v1) could be moved to a compromised release.
            # Bump deliberately by resolving the new tag's SHA and replacing below.
            #
            # Permission gotcha (learned the hard way): the workflow GITHUB_TOKEN
            # is a `ghs_` app-installation token, so the action sees
            # `token owns package = false` and routes DELETEs to
            # /users/{owner}/packages/... (not /user/packages/...). That endpoint
            # requires the calling repo to hold the **Admin** role on the package
            # — `permissions: packages: write` above only grants Write. Without
            # Admin, every DELETE 404s and the action swallows it as "already
            # deleted", falsely reporting success while the versions stay put.
            #
            # Manual setup (not in version control — redo if the package is
            # recreated/migrated): Package settings → Manage Actions access →
            # add this repository (tammarut/yec-lamphun-backoffice-web) with
            # role Admin.
            #
            # If 404s ever return for User-owned packages, the more deterministic
            # fix is a Classic PAT owned by `tammarut` (scopes write:packages +
            # delete:packages) passed via a repo secret; that flips
            # `token owns package = true` and routes to /user/packages/...,
            # which is reliable for owner-owned packages.
            - name: Prune stale image versions
              uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  package: ${{ github.event.repository.name }}
                  delete-untagged: true
                  keep-n-tagged: 3
                  exclude-tags: '^v?\d+\.\d+\.\d+$'
                  use-regex: true
