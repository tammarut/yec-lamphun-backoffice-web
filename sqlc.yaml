version: "2"
plugins:
    - name: ts
      wasm:
          url: "https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.3.wasm"
          sha256: "287df8f6cc06377d67ad5ba02c9e0f00c585509881434d15ea8bd9fc751a9368"
sql:
    - schema: "src/modules/system-settings/repository/sql/schema.sql"
      queries: "src/modules/system-settings/repository/sql/queries.sql"
      engine: "postgresql"
      codegen:
          - out: "src/modules/system-settings/repository/sql/sqlc-generated"
            plugin: ts
            options:
                runtime: "node"
                driver: "postgres"
    - schema: "src/modules/business-categories/repository/sql/schema.sql"
      queries: "src/modules/business-categories/repository/sql/queries.sql"
      engine: "postgresql"
      codegen:
          - out: "src/modules/business-categories/repository/sql/sqlc-generated"
            plugin: ts
            options:
                runtime: "node"
                driver: "postgres"
    # The members module owns members, positions, member_documents,
    # and businesses (see
    # docs/adr/0005-merge-member-business-and-member-document-into-members-module.md).
    # businesses is the shared entity extracted from member_business
    # (spec #66, cutover #72 — member_business is DROPPED); members link to it
    # via the NOT NULL members.business_id FK, so its schema is in this parse
    # set. business_categories is referenced only so its FK resolves during
    # parsing. membership_renewals is likewise referenced only so its FK to
    # members(id) resolves during parsing — the members repo owns the cascade
    # soft-delete queries (ADR-0013/0023); no TS cross-import into
    # membership-renewals/.
    - schema:
          - "src/modules/business-categories/repository/sql/schema.sql"
          - "src/modules/members/repository/businesses/sql/schema.sql"
          - "src/modules/members/repository/sql/schema.sql"
          - "src/modules/members/repository/member-document/sql/schema.sql"
          - "src/modules/membership-renewals/repository/sql/schema.sql"
      queries: "src/modules/members/repository/sql/queries.sql"
      engine: "postgresql"
      codegen:
          - out: "src/modules/members/repository/sql/sqlc-generated"
            plugin: ts
            options:
                runtime: "node"
                driver: "postgres"
    # The membership-renewals module owns renewal create/update/reads. Its
    # sqlc block references members/repository/sql/schema.sql ONLY so the FK to
    # members(id) and the members columns it UPDATEs resolve during parsing — no
    # TS cross-import. members.business_id in turn FKs to businesses, whose
    # category_id FKs to business_categories, so both schemas ride along for
    # parse-time FK resolution only. This is the symmetric mirror of ADR-0013,
    # where the members block references
    # membership-renewals/repository/sql/schema.sql for the cascade
    # soft-delete. The renewals repo owns the cross-table create transaction
    # (ADR-0014).
    - schema:
          - "src/modules/business-categories/repository/sql/schema.sql"
          - "src/modules/members/repository/businesses/sql/schema.sql"
          - "src/modules/members/repository/sql/schema.sql"
          - "src/modules/membership-renewals/repository/sql/schema.sql"
      queries: "src/modules/membership-renewals/repository/sql/queries.sql"
      engine: "postgresql"
      codegen:
          - out: "src/modules/membership-renewals/repository/sql/sqlc-generated"
            plugin: ts
            options:
                runtime: "node"
                driver: "postgres"
    # The dashboard module owns the Dashboard Stat read (ADR-0019). Its sqlc
    # block references members/businesses/business_categories schemas ONLY so
    # the FKs resolve during parsing — no TS cross-import into the members
    # module (symmetric mirror of the renewals block, ADR-0013 pattern).
    # members/schema.sql already contains positions, and members.business_id
    # FKs to businesses, so the businesses schema rides along for parsing.
    # Since the #72 cutover, total_businesses counts non-deleted businesses
    # rows — equal by construction to the pre-cutover live member_business
    # count (non-deleted business ⇔ ≥1 live member).
    - schema:
          - "src/modules/business-categories/repository/sql/schema.sql"
          - "src/modules/members/repository/businesses/sql/schema.sql"
          - "src/modules/members/repository/sql/schema.sql"
      queries: "src/modules/dashboard/repository/sql/queries.sql"
      engine: "postgresql"
      codegen:
          - out: "src/modules/dashboard/repository/sql/sqlc-generated"
            plugin: ts
            options:
                runtime: "node"
                driver: "postgres"
