                                    <div><h4 className="font-bold text-gray-800 text-lg mb-1">LINE Official</h4><p className="text-green-600 text-sm font-medium">@yeclamphun</p><span className="text-xs text-gray-400 mt-1 block">ติดต่อสอบถามข้อมูล</span></div>

                                    <h3 className="text-lg font-bold text-gray-800">แก้ไขข้อมูลกราฟ</h3>

        const OrgChart = ({ members }) => {
            const president = members.find(m => m.position.startsWith("ประธาน") && !m.position.startsWith("รอง"));
            const advisors = members.filter(m => m.position.includes("ที่ปรึกษา"));
            const secretaryTeam = members.filter(m => 
                (m.position.includes("เลขาธิการ") || 
                m.position.includes("ผู้ช่วยเลขาธิการ") || 
                m.position.includes("เหรัญญิก") ||
                m.position.includes("ผู้ประสานงาน")) &&
                !m.position.includes("กฎหมาย")
            );
            const generalMembers = members.filter(m => m.position === "สมาชิกทั่วไป");
            const committeeCount = members.filter(m => m.type === 'Committee').length;
            const legalTeam = members.filter(m => m.position.includes("กฎหมาย"));

            const departments = [];
            const processedIds = new Set([
                president?.id, 
                ...advisors.map(m => m.id), 
                ...legalTeam.map(m => m.id),
                ...secretaryTeam.map(m => m.id),
                ...generalMembers.map(m => m.id)
            ].filter(Boolean));

            members.forEach(m => {
                if (m.position.startsWith("รองประธานฝ่าย") && !processedIds.has(m.id)) {
                    const deptName = m.position.replace("รองประธานฝ่าย", "");
                    const deptCommittees = members.filter(cm => cm.position.startsWith("กรรมการฝ่าย") && cm.position.includes(deptName) && !processedIds.has(cm.id));
                    departments.push({ head: m, committees: deptCommittees });
                    processedIds.add(m.id);
                    deptCommittees.forEach(c => processedIds.add(c.id));
                }
            });

            const ProfileCard = ({ member, roleColor = "blue", extraClass = "" }) => (
                <div className={`bg-white p-3 rounded-xl shadow-md border-t-4 border-${roleColor}-500 w-48 text-center hover:shadow-lg transition transform hover:-translate-y-1 relative z-20 ${extraClass}`}>
                    <img src={member.image} className="w-14 h-14 rounded-full mx-auto mb-2 bg-gray-100 border-2 border-white shadow-sm object-cover"/>
                    <h4 className="font-bold text-gray-800 text-sm truncate px-1">{member.name} {member.nickname && <span className="text-gray-500 font-normal">({member.nickname})</span>}</h4>
                    <p className={`text-${roleColor}-600 text-xs font-medium truncate px-1`}>{member.position}</p>
                    <p className="text-gray-500 text-[10px] truncate px-1 mt-1 pt-1 border-t border-gray-100">{member.department}</p>
                </div>
            );

            return (
                <div className="space-y-8 animate-fade-in">
                     <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 overflow-hidden">
                        <div className="flex items-center justify-between mb-8 border-b pb-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><i className="fa-solid fa-sitemap"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800">คณะกรรมการบริหาร (Executive Committee)</h2>
                            </div>
                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold shadow-sm border border-blue-200">{committeeCount} คน</span>
                        </div>
                        <div className="overflow-x-auto pb-4">
                            <div className="min-w-[1200px] flex flex-col items-center">
                                <div className="flex flex-col items-center relative z-30">
                                    {president ? (
                                        <div className="transform scale-110 relative">
                                            <div className={`bg-white p-3 rounded-xl shadow-md border-t-4 border-blue-500 w-64 text-center hover:shadow-lg transition transform hover:-translate-y-1 relative z-20 shadow-xl ring-4 ring-blue-50`}>
                                                <img src={president.image} className="w-14 h-14 rounded-full mx-auto mb-2 bg-gray-100 border-2 border-white shadow-sm object-cover"/>
                                                <h4 className="font-bold text-gray-800 text-sm truncate px-1">{president.name} {president.nickname && <span className="text-gray-500 font-normal">({president.nickname})</span>}</h4>
                                                <p className="text-blue-600 text-xs font-medium px-1 leading-tight">{president.position}</p>
                                                <p className="text-gray-500 text-[10px] truncate px-1 mt-1 pt-1 border-t border-gray-100">{president.department}</p>
                                            </div>
                                            <div className="absolute bottom-[-2rem] left-1/2 w-0.5 h-8 bg-gray-300"></div>
                                        </div>
                                    ) : (
                                        <div className="p-6 bg-gray-50 rounded-xl text-gray-400 border border-dashed border-gray-300 mb-8">ยังไม่มีประธาน</div>
                                    )}
                                </div>
                                <div className="flex justify-center items-start gap-40 relative mb-12 mt-8 w-full"> 
                                    <div className="absolute top-0 left-[20%] right-[20%] h-0.5 bg-gray-300"></div>
                                    <div className="flex flex-col items-center relative">
                                         <div className="absolute top-0 left-1/2 h-6 w-0.5 bg-gray-300 -mt-0"></div>
                                         <div className="mt-6 mb-4 font-bold text-gray-500 text-sm bg-gray-50 px-3 py-1 rounded-full border border-gray-200 shadow-sm">ฝ่ายกฎหมาย</div>
                                         <div className="flex gap-4 flex-wrap justify-center max-w-md">{legalTeam.map(m => <ProfileCard key={m.id} member={m} roleColor="red" />)}</div>
                                    </div>
                                    <div className="flex flex-col items-center relative">
                                         <div className="absolute top-0 left-1/2 h-6 w-0.5 bg-gray-300 -mt-0"></div>
                                         <div className="mt-6 mb-4 font-bold text-gray-500 text-sm bg-gray-50 px-3 py-1 rounded-full border border-gray-200 shadow-sm">คณะที่ปรึกษา</div>
                                         <div className="flex gap-4 flex-wrap justify-center max-w-md">{advisors.map(m => <ProfileCard key={m.id} member={m} roleColor="gray" />)}</div>
                                    </div>
                                    <div className="relative h-full flex flex-col items-center"><div className="absolute top-[-2rem] w-0.5 h-full bg-gray-300 min-h-[120px] -z-10"></div></div>
                                    <div className="flex flex-col items-center relative">
                                         <div className="absolute top-0 left-1/2 h-6 w-0.5 bg-gray-300 -mt-0"></div>
                                         <div className="mt-6 mb-4 font-bold text-gray-500 text-sm bg-gray-50 px-3 py-1 rounded-full border border-gray-200 shadow-sm">ทีมเลขานุการ</div>
                                         <div className="flex gap-4 flex-wrap justify-center max-w-md">{secretaryTeam.map(m => <ProfileCard key={m.id} member={m} roleColor="purple" />)}</div>
                                    </div>
                                </div>
                                <div className="w-full flex justify-center relative pt-8">
                                    {departments.length > 0 && <div className="absolute top-0 left-[10%] right-[10%] h-0.5 bg-gray-300"></div>}
                                    <div className="absolute top-[-3rem] left-1/2 w-0.5 h-12 bg-gray-300"></div>
                                    <div className="flex justify-center gap-10 pt-8 w-full">
                                        {departments.map((dept, idx) => (
                                            <div key={idx} className="flex flex-col items-center relative">
                                                <div className="absolute top-[-2rem] left-1/2 -translate-x-1/2 h-8 w-0.5 bg-gray-300"></div>
                                                <ProfileCard member={dept.head} roleColor="green" />
                                                {dept.committees.length > 0 && <div className="h-6 w-0.5 bg-gray-300"></div>}
                                                <div className="flex flex-col gap-3 relative">
                                                    {dept.committees.length > 1 && <div className="absolute top-0 bottom-4 left-1/2 w-0.5 bg-gray-200 -z-10"></div>}
                                                    {dept.committees.map(comm => (
                                                        <div key={comm.id} className="bg-white p-2 pl-3 pr-4 rounded-xl shadow border border-gray-100 flex items-center gap-3 w-60 hover:shadow-md transition relative z-10">
                                                            <img src={comm.image} className="w-10 h-10 rounded-full bg-gray-50 object-cover border border-white shadow-sm shrink-0"/>
                                                            <div className="text-left overflow-hidden min-w-0 flex-1">
                                                                <div className="text-xs font-bold text-gray-700 truncate">{comm.name} {comm.nickname && `(${comm.nickname})`}</div>
                                                                <div className="text-[10px] text-gray-500 truncate">กรรมการ</div>
                                                                <div className="text-[10px] text-gray-400 truncate">{comm.department}</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                     </div>

                     <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                        <div className="flex items-center justify-between mb-6 border-b pb-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-orange-100 p-2 rounded-lg text-orange-600"><i className="fa-solid fa-users"></i></div>
                                <div><h3 className="text-xl font-bold text-gray-800">สมาชิกทั่วไป (General Members)</h3><p className="text-sm text-gray-500">รายชื่อสมาชิกที่ไม่ได้ดำรงตำแหน่งในคณะกรรมการ</p></div>
                            </div>
                            <span className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm font-bold">{generalMembers.length} คน</span>
                        </div>
                        {generalMembers.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                                {generalMembers.map(m => (
                                    <div key={m.id} className="flex items-center gap-3 p-4 rounded-xl border border-gray-100 hover:bg-orange-50 hover:border-orange-100 transition group cursor-pointer">
                                        <div className="relative">
                                            <img src={m.image} className="w-12 h-12 rounded-full object-cover border border-gray-200 group-hover:border-white group-hover:shadow-md transition"/>
                                            <div className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${m.status === 'Active' ? 'bg-green-500' : 'bg-gray-400'}`}></div>
                                        </div>
                                        <div className="overflow-hidden">
                                            <div className="text-sm font-bold text-gray-800 truncate group-hover:text-orange-700 transition">{m.name} {m.nickname && `(${m.nickname})`}</div>
                                            <div className="text-xs text-gray-500 truncate">{m.businessName || m.department}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-10 bg-gray-50 rounded-xl border border-dashed border-gray-200"><i className="fa-regular fa-folder-open text-4xl text-gray-300 mb-3"></i><p className="text-gray-500">ไม่มีข้อมูลสมาชิกทั่วไป</p></div>
                        )}
                     </div>
                </div>
            );
        };

        const MemberSystem = ({ members, onAddMember, onUpdateMember, onDeleteMember, isAdmin }) => {
            const [viewMode, setViewMode] = useState('list');
            const [searchTerm, setSearchTerm] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [activeTab, setActiveTab] = useState(1);
            const [editingId, setEditingId] = useState(null);
            const [selectedIds, setSelectedIds] = useState([]);
            const [deleteModal, setDeleteModal] = useState({ show: false, member: null });

            const initialFormState = {
                applicantType: 'Individual', fileCert: null, fileIdCard: null, fileProfile: null, profileImage: '',
                prefixTH: 'นาย', firstNameTH: '', lastNameTH: '', nickname: '', prefixEN: 'Mr.', firstNameEN: '', lastNameEN: '',
                gender: 'Male', dob: '', age: '', idCardNum: '', idCardExpiry: '', nationality: 'ไทย', phone: '', email: '', lineId: '',
                shirtSize: 'M (อก 40)', yecPosition: 'สมาชิกทั่วไป', memberSince: '', membershipDuration: '', status: 'Active',
                businessName: '', juristicId: '', address: '', lat: '', long: '', businessCategory: '', businessDesc: '', productService: '',
                fileLogo: null, fileProduct: null, website: ''
            };

            const [formData, setFormData] = useState(initialFormState);

            const filteredMembers = members.filter(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()) || m.position.toLowerCase().includes(searchTerm.toLowerCase()) || (m.department && m.department.toLowerCase().includes(searchTerm.toLowerCase())));

            const toggleSelectAll = (e) => {
                if (e.target.checked) { setSelectedIds(filteredMembers.map(m => m.id)); } else { setSelectedIds([]); }
            };

            const toggleSelectOne = (id) => {
                if (selectedIds.includes(id)) { setSelectedIds(selectedIds.filter(sid => sid !== id)); } else { setSelectedIds([...selectedIds, id]); }
            };

            const handleExportCSV = () => {
                const selectedData = members.filter(m => selectedIds.includes(m.id));
                if (selectedData.length === 0) return;
                const headers = ['ชื่อ-นามสกุล', 'ชื่อเล่น', 'ตำแหน่ง', 'กิจการ', 'เบอร์โทร', 'อีเมล', 'สถานะ'];
                const csvContent = [headers.join(','), ...selectedData.map(m => [`"${m.name}"`, `"${m.nickname || ''}"`, `"${m.position}"`, `"${m.department || ''}"`, `"${m.phone}"`, `"${m.email}"`, `"${m.status}"`].join(','))].join('\n');
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'yec_members_export.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleBulkStatusChange = (newStatus) => {
                const statusText = newStatus === 'Active' ? 'ปกติ' : 'ยังไม่ได้ต่ออายุ';
                if (!confirm(`คุณต้องการเปลี่ยนสถานะสมาชิกที่เลือกจำนวน ${selectedIds.length} ราย เป็น "${statusText}" ใช่หรือไม่?`)) return;
                 if (onUpdateMember) { onUpdateMember({ ids: selectedIds, status: newStatus, isBulk: true }); setSelectedIds([]); }
            };

            const handleDeleteClick = (member) => { setDeleteModal({ show: true, member }); };
            const confirmDelete = () => { 
                onDeleteMember(deleteModal.member.id); 
                setDeleteModal({ show: false, member: null }); 
                if (selectedIds.includes(deleteModal.member.id)) {
                    setSelectedIds(selectedIds.filter(id => id !== deleteModal.member.id));
                }
            };

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => {
                    const newData = { ...prev };
                    if (type === 'checkbox') { newData[name] = checked ? 'Active' : 'Pending'; return newData; }
                    if (name === 'idCardNum') { newData[name] = value.replace(/\D/g, '').slice(0, 13); return newData; }
                    else { newData[name] = value; }
                    if (name === 'dob' && value) {
                        const birthDate = new Date(value);
                        const today = new Date();
                        let years = today.getFullYear() - birthDate.getFullYear();
                        let months = today.getMonth() - birthDate.getMonth();
                        if (today.getDate() < birthDate.getDate()) { months--; }
                        if (months < 0) { years--; months += 12; }
                        newData.age = `${years} ปี ${months} เดือน`;
                    }
                    if (name === 'memberSince' && value) {
                        const joinDate = new Date(value);
                        const today = new Date();
                        let years = today.getFullYear() - joinDate.getFullYear();
                        let months = today.getMonth() - joinDate.getMonth();
                        let days = today.getDate() - joinDate.getDate();
                        if (days < 0) { months--; days += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
                        if (months < 0) { years--; months += 12; }
                        newData.membershipDuration = `${years} ปี ${months} เดือน ${days} วัน`;
                    }
                    return newData;
                });
            };

            const handleFileChange = (e) => {
                const { name, files } = e.target;
                if (files && files[0]) { setFormData(prev => ({ ...prev, [name]: files[0] })); }
            };

            const handleEditClick = (member) => {
                setEditingId(member.id);
                const nameParts = member.name.split(' ');
                const prefix = nameParts[0].match(/^(นาย|นางสาว|นาง|ดร\.|ว่าที่ร้อยตรี)/) ? nameParts[0].match(/^(นาย|นางสาว|นาง|ดร\.|ว่าที่ร้อยตรี)/)[0] : '';
                const firstName = nameParts[0].replace(prefix, '');
                const lastName = nameParts.slice(1).join(' ');

                let durationStr = '';
                if(member.memberSince) {
                    const joinDate = new Date(member.memberSince);
                    const today = new Date();
                    let years = today.getFullYear() - joinDate.getFullYear();
                    let months = today.getMonth() - joinDate.getMonth();
                    let days = today.getDate() - joinDate.getDate();
                    if (days < 0) { months--; days += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
                    if (months < 0) { years--; months += 12; }
                    durationStr = `${years} ปี ${months} เดือน ${days} วัน`;
                }

                setFormData({
                    ...initialFormState,
                    prefixTH: prefix || 'นาย', firstNameTH: firstName || member.name, lastNameTH: lastName || '', nickname: member.nickname || '',
                    yecPosition: member.position, businessName: member.department, businessDesc: member.businessDesc || '',
                    email: member.email, phone: member.phone, lineId: member.lineId || '', gender: member.gender || 'Male',
                    shirtSize: member.shirtSize || 'M (อก 40)', applicantType: 'Individual', status: member.status || 'Active',
                    memberSince: member.memberSince || '', membershipDuration: durationStr, profileImage: member.image || '', fileProfile: null
                });
                setActiveTab(1);
                setShowModal(true);
            };

            const handleAddClick = () => {
                setEditingId(null);
                setFormData(initialFormState);
                setActiveTab(1);
                setShowModal(true);
            }

            const handleAddSubmit = (e) => {
                e.preventDefault();
                const isPresident = formData.yecPosition.startsWith('ประธาน') && !formData.yecPosition.startsWith('รอง');
                const isRestricted = isPresident || formData.yecPosition === 'เลขาธิการ' || formData.yecPosition.startsWith('รองประธาน');
                if (isRestricted) {
                    const existing = members.find(m => m.position === formData.yecPosition && m.status === 'Active' && m.id !== editingId);
                    if (existing && formData.status === 'Active') {
                        alert(`ไม่สามารถบันทึกได้: ตำแหน่ง "${formData.yecPosition}" มีผู้ดำรงตำแหน่งอยู่แล้ว (${existing.name})`);
                        return;
                    }
                }

                let finalImage = formData.profileImage;
                if (formData.fileProfile) { finalImage = URL.createObjectURL(formData.fileProfile); }
                else if (!finalImage) { finalImage = `https://api.dicebear.com/7.x/avataaars/svg?seed=${formData.firstNameTH}`; }

                const simpleMember = {
                    name: `${formData.prefixTH}${formData.firstNameTH} ${formData.lastNameTH}`,
                    nickname: formData.nickname, position: formData.yecPosition, department: formData.businessName || "ไม่ระบุ",
                    businessDesc: formData.businessDesc, email: formData.email, phone: formData.phone, lineId: formData.lineId,
                    status: formData.status, memberSince: formData.memberSince,
                    type: formData.yecPosition.includes('กรรมการ') || formData.yecPosition.includes('ประธาน') || formData.yecPosition.includes('เลขาธิการ') || formData.yecPosition.includes('เหรัญญิก') ? 'Committee' : 'Staff',
                    gender: formData.gender, shirtSize: formData.shirtSize, image: finalImage
                };
                
                if (editingId) { onUpdateMember({ ...simpleMember, id: editingId }); } else { onAddMember(simpleMember); }
                setShowModal(false);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">รายชื่อสมาชิก</h2>
                        <div className="flex gap-3 w-full md:w-auto">
                             <div className="relative flex-1 md:w-64">
                                <span className="absolute left-3 top-2.5 text-gray-400"><i className="fa-solid fa-search"></i></span>
                                <input type="text" placeholder="ค้นหาชื่อ, ตำแหน่ง..." className="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                             </div>
                             <div className="bg-white rounded-lg border border-gray-200 p-1 flex">
                                <button onClick={() => setViewMode('list')} className={`px-3 py-1 rounded-md transition ${viewMode === 'list' ? 'bg-blue-100 text-blue-600' : 'text-gray-500'}`}><i className="fa-solid fa-list"></i></button>
                                <button onClick={() => setViewMode('card')} className={`px-3 py-1 rounded-md transition ${viewMode === 'card' ? 'bg-blue-100 text-blue-600' : 'text-gray-500'}`}><i className="fa-solid fa-grip"></i></button>
                             </div>
                             {isAdmin && <button onClick={handleAddClick} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-sm flex items-center gap-2 transition"><i className="fa-solid fa-plus"></i><span className="hidden sm:inline">เพิ่มสมาชิก</span></button>}
                        </div>
                    </div>

                    {isAdmin && selectedIds.length > 0 && (
                        <div className="bg-blue-50 border border-blue-100 p-3 rounded-xl flex items-center justify-between animate-fade-in mb-4">
                            <div className="flex items-center gap-2 text-blue-700 font-medium">
                                <i className="fa-solid fa-check-square"></i>
                                <span>เลือกแล้ว {selectedIds.length} รายการ</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={handleExportCSV} className="bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm hover:bg-gray-50 flex items-center gap-2"><i className="fa-solid fa-file-export"></i> Export CSV</button>
                                <button onClick={() => handleBulkStatusChange('Pending')} className="bg-orange-500 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-orange-600 flex items-center gap-2"><i className="fa-solid fa-user-clock"></i> ปรับเป็นยังไม่ได้ต่ออายุ</button>
                                <button onClick={() => handleBulkStatusChange('Active')} className="bg-green-500 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-green-600 flex items-center gap-2"><i className="fa-solid fa-user-check"></i> ปรับเป็นปกติ</button>
                            </div>
                        </div>
                    )}

                    {filteredMembers.length === 0 ? (
                        <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-300"><i className="fa-regular fa-folder-open text-4xl text-gray-300 mb-3"></i><p className="text-gray-500">ไม่พบข้อมูลสมาชิก</p></div>
                    ) : (
                        <>
                            {viewMode === 'list' ? (
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider">
                                                    {isAdmin && <th className="p-4 w-[50px]"><input type="checkbox" className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" onChange={toggleSelectAll} checked={selectedIds.length === filteredMembers.length && filteredMembers.length > 0} /></th>}
                                                    <th className="p-4 font-semibold w-1/4">ชื่อ-สกุล / ตำแหน่ง</th>
                                                    <th className="p-4 font-semibold w-1/5">ธุรกิจ/กิจการ</th>
                                                    <th className="p-4 font-semibold w-1/4">รายละเอียดธุรกิจ</th>
                                                    <th className="p-4 font-semibold w-1/6">ติดต่อ</th>
                                                    {isAdmin && <th className="p-4 font-semibold text-right w-[100px]">จัดการ</th>}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {filteredMembers.map(member => (
                                                    <tr key={member.id} className={`hover:bg-blue-50 transition-colors ${selectedIds.includes(member.id) ? 'bg-blue-50' : ''}`}>
                                                        {isAdmin && <td className="p-4"><input type="checkbox" className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked={selectedIds.includes(member.id)} onChange={() => toggleSelectOne(member.id)} /></td>}
                                                        <td className="p-4">
                                                            <div className="flex items-start gap-3">
                                                                <div className="flex flex-col items-center gap-1 min-w-[60px]">
                                                                    <img src={member.image} alt="" className="w-12 h-12 rounded-full bg-gray-100 object-cover shadow-sm"/>
                                                                    {isAdmin && <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium border ${member.status === 'Active' ? 'bg-green-50 text-green-600 border-green-200' : 'bg-orange-50 text-orange-600 border-orange-200'}`}>{member.status === 'Active' ? 'ปกติ' : 'ยังไม่ได้ต่ออายุ'}</span>}
                                                                </div>
                                                                <div>
                                                                    <div className="font-bold text-gray-800 text-base">{member.name} {member.nickname && <span className="text-gray-500 font-normal">({member.nickname})</span>}</div>
                                                                    <div className="text-sm text-blue-600 font-medium mt-0.5">{member.position}</div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="p-4 align-top"><div className="font-medium text-gray-700 mt-2">{member.department}</div></td>
                                                        <td className="p-4 align-top"><div className="text-sm text-gray-500 mt-2 line-clamp-2">{member.businessDesc || "-"}</div></td>
                                                        <td className="p-4 align-top">
                                                            <div className="space-y-1 mt-1 text-sm">
                                                                <div className="flex items-center gap-2 text-gray-600"><i className="fa-solid fa-phone text-xs w-4 text-center"></i> <span>{member.phone || '-'}</span></div>
                                                                <div className="flex items-center gap-2 text-gray-600"><i className="fa-solid fa-envelope text-xs w-4 text-center"></i> <span className="truncate max-w-[120px]" title={member.email}>{member.email || '-'}</span></div>
                                                                <div className="flex items-center gap-2 text-green-600"><i className="fa-brands fa-line text-xs w-4 text-center"></i> <span>{member.lineId || '-'}</span></div>
                                                            </div>
                                                        </td>
                                                        {isAdmin && <td className="p-4 text-right align-top"><div className="flex flex-col items-end gap-2"><button onClick={() => handleEditClick(member)} className="text-gray-400 hover:text-blue-600 transition p-2 rounded-full hover:bg-blue-50" title="แก้ไขข้อมูล"><i className="fa-solid fa-pen-to-square text-lg"></i></button><button onClick={() => handleDeleteClick(member)} className="text-red-400 hover:text-red-600 transition p-2 rounded-full hover:bg-red-50" title="ลบสมาชิก"><i className="fa-solid fa-trash text-lg"></i></button></div></td>}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {filteredMembers.map(member => (
                                        <div key={member.id} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col h-full relative group">
                                            {isAdmin && (
                                                <div className="absolute top-3 left-3 z-10"> 
                                                    <span className={`px-2 py-1 rounded-lg text-xs font-bold shadow-sm ${member.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>
                                                        {member.status === 'Active' ? 'ปกติ' : 'ยังไม่ได้ต่ออายุ'}
                                                    </span>
                                                </div>
                                            )}
                                            {isAdmin && <div className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition z-10 flex flex-col items-end gap-1"><button onClick={() => handleEditClick(member)} className="text-gray-400 hover:text-blue-600 p-2 bg-white rounded-full shadow-sm border border-gray-100"><i className="fa-solid fa-pen-to-square"></i></button><button onClick={() => handleDeleteClick(member)} className="text-red-400 hover:text-red-600 p-2 bg-white rounded-full shadow-sm border border-gray-100"><i className="fa-solid fa-trash"></i></button></div>}
                                            <div className="flex flex-col items-center text-center mb-4 mt-2">
                                                <img src={member.image} className="w-20 h-20 rounded-full bg-gray-50 mb-3 shadow-inner object-cover"/>
                                                <h3 className="font-bold text-gray-800 text-lg">{member.name} {member.nickname && <span className="text-sm text-gray-500 font-normal">({member.nickname})</span>}</h3>
                                                <p className="text-blue-600 text-sm font-medium mt-1">{member.position}</p>
                                            </div>
                                            <div className="flex-1 space-y-2 mb-4 text-center">
                                                <div className="text-sm font-semibold text-gray-700 bg-gray-50 rounded px-2 py-1 inline-block">{member.department}</div>
                                                <p className="text-xs text-gray-500 line-clamp-3 px-2 mt-2">{member.businessDesc || "-"}</p>
                                            </div>
                                            <div className="pt-4 border-t border-gray-100 grid grid-cols-1 gap-2 text-sm">
                                                <div className="flex items-center gap-2 text-gray-600 justify-center"><i className="fa-solid fa-phone text-xs"></i> <span>{member.phone || '-'}</span></div>
                                                 <div className="flex items-center gap-2 text-gray-600 justify-center"><i className="fa-solid fa-envelope text-xs"></i> <span className="truncate max-w-[180px]">{member.email || '-'}</span></div>
                                                 <div className="flex items-center gap-2 text-green-600 justify-center"><i className="fa-brands fa-line text-xs"></i> <span>{member.lineId || '-'}</span></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}

                    {deleteModal.show && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm animate-fade-in relative text-center">
                                <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl"><i className="fa-solid fa-trash-can"></i></div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">ยืนยันการลบสมาชิก</h3>
                                <p className="text-gray-500 mb-6 text-sm">คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลของ<br/> <strong>{deleteModal.member?.name}</strong> <br/>ออกจากระบบ? การกระทำนี้ไม่สามารถย้อนกลับได้</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteModal({ show: false, member: null })} className="flex-1 py-2.5 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition font-medium">ยกเลิก</button>
                                    <button onClick={confirmDelete} className="flex-1 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-md transition font-medium">ยืนยันลบ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col animate-fade-in shadow-2xl">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                                    <div className="flex items-center gap-3"><div className="bg-blue-600 p-2 rounded-lg text-white"><i className={`fa-solid ${editingId ? 'fa-user-pen' : 'fa-user-plus'} text-xl`}></i></div><div><h3 className="text-xl font-bold text-gray-800">{editingId ? 'แก้ไขข้อมูลสมาชิก' : 'ลงทะเบียนสมาชิกใหม่'}</h3><p className="text-sm text-gray-500">YEC Lamphun Member System</p></div></div>
                                    <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-red-500 transition"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="flex border-b">
                                    <button onClick={() => setActiveTab(1)} className={`flex-1 py-4 font-medium text-sm flex items-center justify-center gap-2 transition border-b-2 ${activeTab === 1 ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-file-contract"></i> 1. ข้อมูลการสมัคร</button>
                                    <button onClick={() => setActiveTab(2)} className={`flex-1 py-4 font-medium text-sm flex items-center justify-center gap-2 transition border-b-2 ${activeTab === 2 ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-user"></i> 2. ข้อมูลส่วนตัว</button>
                                    <button onClick={() => setActiveTab(3)} className={`flex-1 py-4 font-medium text-sm flex items-center justify-center gap-2 transition border-b-2 ${activeTab === 3 ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-briefcase"></i> 3. ข้อมูลธุรกิจ</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6">
                                    <form id="addMemberForm" onSubmit={handleAddSubmit}>
                                        {activeTab === 1 && (
                                            <div className="space-y-6 animate-fade-in">
                                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6">
                                                    <h4 className="font-bold text-blue-800 mb-3">ประเภทการสมัคร</h4>
                                                    <div className="flex gap-6">
                                                        <label className="flex items-center gap-3 cursor-pointer p-3 bg-white rounded-lg border border-blue-200 shadow-sm flex-1"><input type="radio" name="applicantType" value="Individual" checked={formData.applicantType === 'Individual'} onChange={handleInputChange} className="w-5 h-5 text-blue-600" /><span className="font-medium">บุคคลธรรมดา</span></label>
                                                        <label className="flex items-center gap-3 cursor-pointer p-3 bg-white rounded-lg border border-blue-200 shadow-sm flex-1"><input type="radio" name="applicantType" value="Juristic" checked={formData.applicantType === 'Juristic'} onChange={handleInputChange} className="w-5 h-5 text-blue-600" /><span className="font-medium">นิติบุคคล</span></label>
                                                    </div>
                                                </div>
                                                <div className="space-y-4">
                                                    <h4 className="form-section-title"><i className="fa-solid fa-paperclip text-blue-500"></i> เอกสารแนบ</h4>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                        <div className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-500 transition bg-gray-50"><i className="fa-solid fa-file-contract text-3xl text-gray-400 mb-2"></i><p className="text-sm font-medium text-gray-700 mb-1">หนังสือรับรองบริษัท/ทะเบียนพาณิชย์</p><input type="file" name="fileCert" onChange={handleFileChange} className="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" /></div>
                                                        <div className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-500 transition bg-gray-50"><i className="fa-solid fa-id-card text-3xl text-gray-400 mb-2"></i><p className="text-sm font-medium text-gray-700 mb-1">สำเนาบัตรประชาชน</p><input type="file" name="fileIdCard" onChange={handleFileChange} className="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" /></div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        {activeTab === 2 && (
                                            <div className="space-y-6 animate-fade-in">
                                                <h4 className="form-section-title"><i className="fa-solid fa-user-tag text-blue-500"></i> ข้อมูลส่วนบุคคล</h4>
                                                <div className="flex flex-col items-center mb-6">
                                                    <div className="relative w-32 h-32 mb-3 group">
                                                        <img src={formData.fileProfile ? URL.createObjectURL(formData.fileProfile) : (formData.profileImage || "https://via.placeholder.com/150?text=No+Image")} alt="Profile Preview" className="w-32 h-32 rounded-full object-cover border-4 border-white shadow-md bg-gray-100"/>
                                                        <label htmlFor="fileProfile" className="absolute bottom-0 right-0 bg-blue-600 text-white p-2.5 rounded-full cursor-pointer hover:bg-blue-700 shadow-lg border-2 border-white transition transform hover:scale-110"><i className="fa-solid fa-camera"></i></label>
                                                        <input type="file" id="fileProfile" name="fileProfile" accept="image/*" className="hidden" onChange={handleFileChange} />
                                                    </div>
                                                    <p className="text-sm text-gray-500 font-medium">รูปโปรไฟล์ (แนะนำขนาด 1:1)</p>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                                    <div className="md:col-span-3"><label className="block text-sm font-medium text-gray-700 mb-1">คำนำหน้า (TH)</label><select name="prefixTH" value={formData.prefixTH} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2"><option value="นาย">นาย</option><option value="นาง">นาง</option><option value="นางสาว">นางสาว</option><option value="อื่นๆ">อื่นๆ</option></select></div>
                                                    <div className="md:col-span-4"><label className="block text-sm font-medium text-gray-700 mb-1">ชื่อ (TH)</label><input type="text" name="firstNameTH" value={formData.firstNameTH} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div className="md:col-span-5"><label className="block text-sm font-medium text-gray-700 mb-1">นามสกุล (TH)</label><input type="text" name="lastNameTH" value={formData.lastNameTH} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4"><div className="md:col-span-3"><label className="block text-sm font-medium text-gray-700 mb-1">ชื่อเล่น</label><input type="text" name="nickname" value={formData.nickname} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="ชื่อเล่น" /></div></div>
                                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 bg-gray-50 p-4 rounded-lg">
                                                    <div className="md:col-span-3"><label className="block text-sm font-medium text-gray-700 mb-1">Prefix (EN)</label><select name="prefixEN" value={formData.prefixEN} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2"><option value="Mr.">Mr.</option><option value="Mrs.">Mrs.</option><option value="Ms.">Ms.</option><option value="Miss">Miss</option></select></div>
                                                    <div className="md:col-span-4"><label className="block text-sm font-medium text-gray-700 mb-1">First Name</label><input type="text" name="firstNameEN" value={formData.firstNameEN} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div className="md:col-span-5"><label className="block text-sm font-medium text-gray-700 mb-1">Last Name</label><input type="text" name="lastNameEN" value={formData.lastNameEN} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                                    <div className="md:col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">เพศ</label><select name="gender" value={formData.gender} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2"><option value="Male">ชาย</option><option value="Female">หญิง</option><option value="Other">อื่นๆ</option></select></div>
                                                    <div className="md:col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">วันเดือนปีเกิด</label><input type="date" name="dob" value={formData.dob} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div className="md:col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">อายุ</label><input type="text" value={formData.age} readOnly className="w-full border border-gray-200 bg-gray-50 text-gray-500 rounded-lg px-3 py-2 text-center text-sm" placeholder="-" /></div>
                                                    <div className="md:col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">สัญชาติ</label><input type="text" name="nationality" value={formData.nationality} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">เลขบัตรประชาชน (13 หลัก)</label><input type="text" name="idCardNum" value={formData.idCardNum} onChange={handleInputChange} maxLength="13" className="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="x-xxxx-xxxxx-xx-x" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">วันหมดอายุบัตร</label><input type="date" name="idCardExpiry" value={formData.idCardExpiry} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                </div>
                                                <h4 className="form-section-title mt-6"><i className="fa-solid fa-id-card-clip text-blue-500"></i> การต่ออายุสมาชิก</h4>
                                                <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-100 grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">เป็นสมาชิกตั้งแต่</label><input type="date" name="memberSince" value={formData.memberSince} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">ระยะเวลาการเป็นสมาชิก</label><input type="text" value={formData.membershipDuration} readOnly className="w-full border border-gray-200 bg-white text-gray-600 rounded-lg px-3 py-2 text-sm" placeholder="-" /></div>
                                                    <div className="flex flex-col justify-center">
                                                        <label className="block text-sm font-medium text-gray-700 mb-2">สถานะสมาชิก</label>
                                                        <div className="flex items-center gap-3">
                                                            <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in"><input type="checkbox" name="status" id="statusToggle" className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" checked={formData.status === 'Active'} onChange={handleInputChange}/><label htmlFor="statusToggle" className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label></div>
                                                            <span className={`text-sm font-bold ${formData.status === 'Active' ? 'text-green-600' : 'text-orange-500'}`}>{formData.status === 'Active' ? 'ปกติ' : 'ยังไม่ได้ต่ออายุ'}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <h4 className="form-section-title mt-6"><i className="fa-solid fa-address-book text-blue-500"></i> ข้อมูลติดต่อ & อื่นๆ</h4>
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label><input type="tel" name="phone" value={formData.phone} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="xxx-xxx-xxxx" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">อีเมล</label><input type="email" name="email" value={formData.email} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Line ID</label><input type="text" name="lineId" value={formData.lineId} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">ไซส์เสื้อ (Shirt Size)</label><select name="shirtSize" value={formData.shirtSize} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2">{shirtSizes.map((size, idx) => (<option key={idx} value={size}>{size}</option>))}</select></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">ตำแหน่งใน YEC Lamphun</label><select name="yecPosition" value={formData.yecPosition} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">{yecPositions.map((pos, idx) => (<option key={idx} value={pos}>{pos}</option>))}</select></div>
                                                </div>
                                            </div>
                                        )}
                                        {activeTab === 3 && (
                                            <div className="space-y-6 animate-fade-in">
                                                <h4 className="form-section-title"><i className="fa-solid fa-store text-blue-500"></i> ข้อมูลกิจการ/ร้านค้า</h4>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">ชื่อกิจการ/ร้านค้า</label><input type="text" name="businessName" value={formData.businessName} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2 font-medium" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">เลขทะเบียนนิติบุคคล</label><input type="text" name="juristicId" value={formData.juristicId} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">หมวดธุรกิจหลัก</label><select name="businessCategory" value={formData.businessCategory} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2"><option value="">-- เลือกหมวดธุรกิจ --</option>{businessCategories.map((cat, idx) => (<option key={idx} value={cat}>{cat}</option>))}</select></div>
                                                </div>
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">ที่อยู่กิจการ</label><textarea name="address" value={formData.address} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2 h-20"></textarea></div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Latitude</label><input type="text" name="lat" value={formData.lat} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Longitude</label><input type="text" name="long" value={formData.long} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                </div>
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">รายละเอียดกิจการสั้นๆ</label><textarea name="businessDesc" value={formData.businessDesc} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2 h-20" placeholder="แนะนำธุรกิจของท่าน..."></textarea></div>
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">ผลิตภัณฑ์หรือบริการหลัก</label><input type="text" name="productService" value={formData.productService} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" /></div>
                                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Website (ถ้ามี)</label><input type="text" name="website" value={formData.website} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="www.example.com" /></div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                                    <div className="border-2 border-dashed border-gray-300 rounded-xl p-4 bg-gray-50 flex flex-col items-center justify-center gap-2 text-center hover:border-blue-400 transition"><i className="fa-solid fa-image text-2xl text-gray-400"></i><p className="text-sm font-medium text-gray-600">แนบรูปโลโก้ (Logo)</p><input type="file" name="fileLogo" onChange={handleFileChange} className="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" /></div>
                                                    <div className="border-2 border-dashed border-gray-300 rounded-xl p-4 bg-gray-50 flex flex-col items-center justify-center gap-2 text-center hover:border-blue-400 transition"><i className="fa-solid fa-box-open text-2xl text-gray-400"></i><p className="text-sm font-medium text-gray-600">แนบรูปผลิตภัณฑ์ (Product)</p><input type="file" name="fileProduct" onChange={handleFileChange} className="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" /></div>
                                                </div>
                                            </div>
                                        )}
                                    </form>
                                </div>
                                <div className="p-6 border-t bg-gray-50 rounded-b-2xl flex justify-between">
                                    <button onClick={() => activeTab > 1 && setActiveTab(activeTab - 1)} disabled={activeTab === 1} className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-200 bg-white border border-gray-300'}`}><i className="fa-solid fa-arrow-left mr-2"></i> ย้อนกลับ</button>
                                    {activeTab < 3 ? (
                                        <button onClick={() => setActiveTab(activeTab + 1)} className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium shadow-md">ถัดไป <i className="fa-solid fa-arrow-right ml-2"></i></button>
                                    ) : (
                                        <button onClick={handleAddSubmit} className="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium shadow-md"><i className="fa-solid fa-save mr-2"></i> บันทึกข้อมูล</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MembershipRenewal = ({ members, onUpdateMember, isAdmin }) => {
            const [filterStatus, setFilterStatus] = useState(isAdmin ? 'Verifying' : 'Pending');
            const [searchTerm, setSearchTerm] = useState('');
            const [showRenewalModal, setShowRenewalModal] = useState(false);
            const [renewalData, setRenewalData] = useState({ name: '', slip: null, consent: false, slipPreview: null, isAdditionalMember: false, additionalMemberCount: 1, additionalMembers: [''] });
            const [renewalSuggestions, setRenewalSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [isRenewalOpen, setIsRenewalOpen] = useState(true);
            const [isManualRenewMode, setIsManualRenewMode] = useState(false);
            const [activeAdditionalMemberIndex, setActiveAdditionalMemberIndex] = useState(null);
            const [additionalSuggestions, setAdditionalSuggestions] = useState([]);

            const [verifyModal, setVerifyModal] = useState({ show: false, member: null });
            const [rejectReason, setRejectReason] = useState('');
            const [isRejecting, setIsRejecting] = useState(false);

            useEffect(() => { if (isAdmin) setFilterStatus('Verifying'); }, [isAdmin]);

            const filteredList = members.filter(m => {
                const matchesSearch = m.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      m.phone.includes(searchTerm);
                
                let matchesStatus = false;
                if (filterStatus === 'All') {
                    matchesStatus = true;
                } else if (filterStatus === 'Pending') {
                    matchesStatus = m.status === 'Pending' || m.status === 'ContactStaff';
                } else {
                    matchesStatus = m.status === filterStatus;
                }

                return matchesSearch && matchesStatus;
            });

            const handleQuickRenew = (member) => {
                const action = member.status === 'Verifying' ? 'อนุมัติการต่ออายุ' : 'ต่ออายุ';
                if (confirm(`ยืนยันการ${action}ให้กับ ${member.name}?`)) { onUpdateMember({ ...member, status: 'Active' }); }
            };

            const handleManualRenewClick = (member) => {
                setRenewalData({ 
                    name: member.name, 
                    slip: null, 
                    consent: false, 
                    slipPreview: null, 
                    isAdditionalMember: false, 
                    additionalMemberCount: 1,
                    additionalMembers: [''] 
                });
                setIsManualRenewMode(true);
                setShowRenewalModal(true);
            };

            const handleRenewalSubmit = (e) => {
                e.preventDefault();
                if (!renewalData.consent) { alert("กรุณายอมรับเงื่อนไขการให้ข้อมูลส่วนบุคคล"); return; }
                const targetMember = members.find(m => m.name === renewalData.name);
                if (targetMember) {
                    if (isManualRenewMode && isAdmin) {
                        onUpdateMember({ ...targetMember, status: 'Active' });
                        
                        // Handle additional members if any
                        if (renewalData.isAdditionalMember) {
                            renewalData.additionalMembers.forEach(name => {
                                if (name) {
                                    const addMember = members.find(m => m.name === name);
                                    if (addMember) onUpdateMember({ ...addMember, status: 'Active' });
                                }
                            });
                        }

                        alert(`อนุมัติการต่ออายุสำหรับ "${renewalData.name}" ${renewalData.isAdditionalMember ? 'และสมาชิกเพิ่มเติม' : ''} เรียบร้อยแล้ว`);
                    } else {
                        onUpdateMember({ ...targetMember, status: 'Verifying' });
                        let msg = `บันทึกข้อมูลการแจ้งต่ออายุของ "${renewalData.name}" เรียบร้อยแล้ว\n`;
                        
                        if (renewalData.isAdditionalMember) {
                            const additionalNames = renewalData.additionalMembers.filter(n => n.trim() !== '').join(', ');
                            if (additionalNames) {
                                msg += `(รวมสมาชิกเพิ่มเติม: ${additionalNames})\n`;
                            }
                        }
                        
                        msg += `สถานะจะเปลี่ยนเป็น "รอตรวจสอบ" เพื่อให้เจ้าหน้าที่ตรวจสอบหลักฐานการโอนเงิน`;
                        alert(msg);
                    }
                    setShowRenewalModal(false);
                    setRenewalData({ name: '', slip: null, consent: false, slipPreview: null, isAdditionalMember: false, additionalMemberCount: 1, additionalMembers: [''] });
                    setIsManualRenewMode(false);
                } else { alert("ไม่พบรายชื่อสมาชิกหลักในระบบ (กรุณาเลือกจากรายชื่อที่แนะนำ)"); }
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setRenewalData({ 
                        ...renewalData, 
                        slip: file,
                        slipPreview: URL.createObjectURL(file) 
                    });
                }
            };

            const handleRenewalNameChange = (e) => {
                if (isManualRenewMode) return;
                const value = e.target.value;
                setRenewalData({ ...renewalData, name: value });
                if (value.trim().length > 0) {
                    const matches = members.filter(m => m.name.toLowerCase().includes(value.toLowerCase()) || (m.department && m.department.toLowerCase().includes(value.toLowerCase())));
                    setRenewalSuggestions(matches);
                    setShowSuggestions(true);
                } else {
                    setRenewalSuggestions([]);
                    setShowSuggestions(false);
                }
            };

            const selectSuggestion = (member) => {
                setRenewalData({ ...renewalData, name: member.name });
                setShowSuggestions(false);
            };

            // Handlers for Additional Members
            const handleCountChange = (e) => {
                const count = parseInt(e.target.value);
                const currentMembers = renewalData.additionalMembers;
                let newMembers = [...currentMembers];
                
                if (count > currentMembers.length) {
                    for (let i = 0; i < count - currentMembers.length; i++) {
                        newMembers.push('');
                    }
                } else {
                    newMembers = newMembers.slice(0, count);
                }
                
                setRenewalData({ 
                    ...renewalData, 
                    additionalMemberCount: count,
                    additionalMembers: newMembers
                });
            };

            const handleAdditionalMemberNameChange = (index, value) => {
                const newMembers = [...renewalData.additionalMembers];
                newMembers[index] = value;
                setRenewalData({ ...renewalData, additionalMembers: newMembers });

                // Search logic for additional members
                if (value.trim().length > 0) {
                    const matches = members.filter(m => 
                        m.name.toLowerCase().includes(value.toLowerCase()) ||
                        (m.department && m.department.toLowerCase().includes(value.toLowerCase()))
                    );
                    setAdditionalSuggestions(matches);
                    setActiveAdditionalMemberIndex(index);
                } else {
                    setAdditionalSuggestions([]);
                    setActiveAdditionalMemberIndex(null);
                }
            };

            const selectAdditionalMemberSuggestion = (index, member) => {
                const newMembers = [...renewalData.additionalMembers];
                newMembers[index] = member.name;
                setRenewalData({ ...renewalData, additionalMembers: newMembers });
                setAdditionalSuggestions([]);
                setActiveAdditionalMemberIndex(null);
            };

            const handleVerifyClick = (member) => {
                setVerifyModal({ show: true, member });
                setIsRejecting(false);
                setRejectReason('');
            };

            const handleViewSlip = (member) => {
                setVerifyModal({ show: true, member });
                setIsRejecting(false);
            };

            const handleApprove = () => {
                onUpdateMember({ ...verifyModal.member, status: 'Active' });
                setVerifyModal({ show: false, member: null });
                alert(`อนุมัติการต่ออายุสมาชิก ${verifyModal.member.name} เรียบร้อยแล้ว`);
            };

            const handleReject = () => {
                if (!rejectReason.trim()) { alert('กรุณาระบุเหตุผลที่ไม่อนุมัติ'); return; }
                onUpdateMember({ ...verifyModal.member, status: 'ContactStaff' }); 
                setVerifyModal({ show: false, member: null });
                alert(`บันทึกการไม่อนุมัติ: ${rejectReason}\nสถานะเปลี่ยนเป็น "กรุณาติดต่อเจ้าหน้าที่"`);
            };

            const closeRenewalModal = () => {
                setShowRenewalModal(false);
                setIsManualRenewMode(false);
                setAdditionalSuggestions([]);
                setActiveAdditionalMemberIndex(null);
            }

            if (!isRenewalOpen && !isAdmin) {
                return (
                    <div className="flex flex-col items-center justify-center h-full p-8 text-center animate-fade-in">
                        <div className="bg-gray-100 p-6 rounded-full mb-6"><i className="fa-solid fa-calendar-xmark text-4xl text-gray-400"></i></div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-2">ยังไม่อยู่ในช่วงระยะเวลาการต่ออายุ</h2>
                        <p className="text-gray-500 mb-6 max-w-md">ขณะนี้ระบบปิดรับการแจ้งต่ออายุสมาชิกชั่วคราว กรุณาติดต่อสอบถามเพิ่มเติมได้ที่ฝ่ายข้อมูลและทะเบียนสมาชิก</p>
                        <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 text-left">
                            <div className="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center text-blue-600"><i className="fa-solid fa-phone"></i></div>
                            <div><p className="text-xs text-gray-500 font-bold uppercase">ติดต่อเจ้าหน้าที่</p><p className="text-gray-800 font-bold">053-511-168</p></div>
                        </div>
                    </div>
                );
            }

            const pendingCount = members.filter(m => m.status === 'Pending' || m.status === 'ContactStaff').length;

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <h2 className="text-2xl font-bold text-gray-800">ระบบต่ออายุสมาชิก</h2>
                            {isAdmin && (
                                <div className="flex items-center bg-gray-100 rounded-full p-1 border border-gray-200">
                                    <button onClick={() => setIsRenewalOpen(true)} className={`px-3 py-1 rounded-full text-xs font-bold transition ${isRenewalOpen ? 'bg-green-500 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>เปิด</button>
                                    <button onClick={() => setIsRenewalOpen(false)} className={`px-3 py-1 rounded-full text-xs font-bold transition ${!isRenewalOpen ? 'bg-red-500 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>ปิด</button>
                                </div>
                            )}
                        </div>
                        <button onClick={() => { setIsManualRenewMode(false); setShowRenewalModal(true); }} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-md flex items-center gap-2 transition"><i className="fa-solid fa-file-invoice-dollar"></i> แจ้งชำระเงิน / ต่ออายุ</button>
                    </div>

                    {!isRenewalOpen && isAdmin && (
                        <div className="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-xl flex items-center gap-3 mb-4"><i className="fa-solid fa-triangle-exclamation text-lg"></i><span className="font-medium text-sm">ระบบแจ้งต่ออายุปิดอยู่ (สมาชิกทั่วไปจะไม่เห็นหน้านี้)</span></div>
                    )}

                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 right-0 opacity-10 transform translate-x-1/4 -translate-y-1/4"><i className="fa-solid fa-bullhorn text-9xl"></i></div>
                        <div className="relative z-10 flex flex-col md:flex-row gap-8">
                            <div className="flex-1">
                                <h3 className="text-xl font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-circle-info text-yellow-300"></i> อัตราค่าธรรมเนียมการต่ออายุสมาชิก</h3>
                                <div className="text-3xl font-bold mb-1 text-white">5,000 บาท <span className="text-lg font-normal opacity-80">/ กิจการ</span></div>
                            </div>
                            <div className="w-px bg-white/20 hidden md:block"></div>
                            <div className="flex-1">
                                <h4 className="font-bold text-yellow-300 mb-2">ส่วนลดพิเศษ:</h4>
                                <ul className="space-y-2 text-sm">
                                    <li className="flex items-start gap-2"><i className="fa-solid fa-check-circle mt-1 opacity-80"></i><div><span className="font-semibold">กิจการเดียวกัน ท่านที่ 2</span><div className="text-xs opacity-90">ลด 1,000 บาท (ชำระเพียง 4,000 บาท)</div></div></li>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

                                </thead>
                                <tbody className="divide-y divide-gray-50">
                                    {filteredList.length > 0 ? (

                                                <td className="p-4 text-sm text-gray-600">{member.memberSince || "-"}</td>
                                                {/* Display Transaction Date only for Admin */}

                                                        member.status === 'Verifying' ? 'bg-yellow-100 text-yellow-700' :
                                                        member.status === 'ContactStaff' ? 'bg-red-50 text-red-600 border border-red-200' :
                                                        'bg-orange-100 text-orange-700'
                                                    }`}>
                                                        {member.status === 'Active' ? 'ปกติ' : 
                                                         member.status === 'Verifying' ? 'รอตรวจสอบ' : 
                                                         member.status === 'ContactStaff' ? 'กรุณาติดต่อฝ่ายข้อมูลและทะเบียนสมาชิก' :

                                                        <button onClick={() => handleManualRenewClick(member)} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs shadow-sm transition flex items-center gap-1 ml-auto"><i className="fa-solid fa-rotate-right"></i> ต่ออายุ (Manual)</button>
                                                    ) : member.status === 'Pending' ? (
                                                        <button onClick={() => handleManualRenewClick(member)} className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs shadow-sm transition flex items-center gap-1 ml-auto"><i className="fa-solid fa-file-pen"></i> ต่ออายุ (Manual)</button>

                                                            </button>
                                                        </div>
                                                    ) : (

                                                            <select 
                                                                className="border border-blue-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white"
