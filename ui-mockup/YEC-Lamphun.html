                                                            >
                                                                {[1, 2, 3, 4, 5].map(num => (
                                                                    <option key={num} value={num}>{num} ท่าน</option>

                                                                        type="text" 
                                                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                                                        placeholder="ระบุชื่อ-สกุล หรือค้นหา..." 
                                                                        value={member}
                                                                        onChange={(e) => handleAdditionalMemberNameChange(index, e.target.value)}
                                                                        required={renewalData.isAdditionalMember}
                                                                    />
                                                                    {activeAdditionalMemberIndex === index && additionalSuggestions.length > 0 && (

                                                                                <div 
                                                                                    key={m.id} 
                                                                                    className="p-2 hover:bg-blue-50 cursor-pointer text-sm border-b border-gray-50 last:border-0"
                                                                                    onClick={() => selectAdditionalMemberSuggestion(index, m)}
                                                                                >
                                                                                    <div className="font-bold text-gray-800">{m.name}</div>
                                                                                    <div className="text-xs text-gray-500">{m.department}</div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">หลักฐานการโอนเงิน (Slip) <span className="text-red-500">*</span></label>

                                                    {renewalData.slipPreview ? (
                                                        <div className="mt-2">
                                                            <img src={renewalData.slipPreview} alt="Slip Preview" className="max-h-40 mx-auto rounded border border-gray-200 shadow-sm" />
                                                            <p className="text-xs text-green-600 font-medium mt-1">ไฟล์ที่เลือก: {renewalData.slip.name}</p>
                                                        </div>
                                                    ) : null}
                                                    </div>
                                                    <input required type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleFileChange} />
                                                </div>
                                            </div>
                                        </div>
                                        <div className="pt-4 border-t border-gray-100">
                                            {/* ... PDPA Content ... */}

                                                {/* Truncated for brevity */}
                                            </div>

                                            <label className="flex items-start gap-3 cursor-pointer group">
                                                <div className="relative flex items-center"><input type="checkbox" className="w-5 h-5 border-gray-300 rounded text-blue-600 focus:ring-blue-500 cursor-pointer" checked={renewalData.consent} onChange={e => setRenewalData({...renewalData, consent: e.target.checked})}/></div>
                                                <span className="text-sm text-gray-700 select-none group-hover:text-blue-600">ข้าพเจ้าได้อ่านและยอมรับเงื่อนไขการเก็บรวบรวม ใช้ และเปิดเผยข้อมูลส่วนบุคคลข้างต้น</span>
                                            </label>
                                        </div>
                                        {!isManualRenewMode && (

                                                <i className="fa-solid fa-circle-info text-blue-600 mt-0.5 text-lg"></i>
                                                <div><p className="text-sm text-blue-800 font-bold">หมายเหตุ:</p><p className="text-sm text-blue-700">ข้อมูลใช้เวลาในการอัพเดท 1-2 วันทำการ หากสถานะยังไม่ถูกปรับ กรุณาติดต่อ <span className="font-semibold underline cursor-pointer">ฝ่ายข้อมูลและทะเบียนสมาชิก</span></p></div>
                                            </div>

                                                <i className={`fa-solid ${isManualRenewMode ? 'fa-check' : 'fa-paper-plane'}`}></i> {isManualRenewMode ? 'อนุมัติ (Active)' : 'ส่งข้อมูล'}

                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                    {verifyModal.show && (

                                <div className="p-6 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                                    <h3 className="text-xl font-bold text-gray-800">
                                        {verifyModal.member.status === 'Active' ? 'หลักฐานการโอนเงิน' : 'ตรวจสอบการชำระเงิน'}

                                    <button onClick={() => setVerifyModal({ show: false, member: null })} className="text-gray-400 hover:text-red-500 transition"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="p-6 overflow-y-auto">
                                    
                                    {/* Member Info Section */}

                                                <p className="text-gray-500 text-xs">ชื่อ-สกุล</p>

                                                <p className="text-gray-500 text-xs">ชื่อเล่น</p>

                                            <div className="col-span-2">

                                                <p className="font-semibold text-gray-800">
                                                    {verifyModal.member.type === 'Committee' ? 'คณะกรรมการ' : 'สมาชิกทั่วไป'}

                                            </div>
                                        </div>
                                    </div>

                                        !isRejecting ? (
                                            <div className="flex gap-3">
                                                <button onClick={() => setIsRejecting(true)} className="flex-1 py-3 bg-red-100 text-red-600 rounded-xl font-bold hover:bg-red-200 transition">ไม่อนุมัติ</button>
                                                <button onClick={handleApprove} className="flex-1 py-3 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 shadow-md transition">อนุมัติ</button>
                                            </div>
                                        ) : (
                                            <div className="animate-fade-in">
                                                <label className="block text-sm font-bold text-gray-700 mb-2">ระบุเหตุผลที่ไม่อนุมัติ</label>
                                                <textarea 
                                                    className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none mb-4" 
                                                    rows="3" 
                                                    placeholder="เช่น สลิปไม่ชัดเจน, ยอดเงินไม่ถูกต้อง..."
                                                    value={rejectReason}
                                                    onChange={(e) => setRejectReason(e.target.value)}
                                                ></textarea>
                                                <div className="flex gap-3">
                                                    <button onClick={() => setIsRejecting(false)} className="flex-1 py-2 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50">ยกเลิก</button>
                                                    <button onClick={handleReject} className="flex-1 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-sm">ยืนยันไม่อนุมัติ</button>
                                                </div>
                                            </div>
                                        )
                                    ) : (
                                        <div className="flex justify-center">
                                            <button onClick={() => setVerifyModal({ show: false, member: null })} className="px-6 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium transition">ปิดหน้าต่าง</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [members, setMembers] = useState(initialMembers);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [showAdminLogoutConfirm, setShowAdminLogoutConfirm] = useState(false);

            const toggleSidebar = () => { setIsSidebarCollapsed(!isSidebarCollapsed); };

            const handleAddMember = (newMemberData) => {
                const newId = members.length + 1;
                const memberToAdd = { ...newMemberData, id: newId, image: `https://api.dicebear.com/7.x/avataaars/svg?seed=${newMemberData.name}` };
                setMembers([memberToAdd, ...members]);
                alert("บันทึกข้อมูลสมาชิกใหม่เรียบร้อยแล้ว");
            };

            const handleDeleteMember = (memberId) => {
                setMembers(members.filter(m => m.id !== memberId));
                alert("ลบข้อมูลสมาชิกเรียบร้อยแล้ว");
            };

            const handleUpdateMember = (updatedMember) => {
                let updatedList;
                if (updatedMember.isBulk) {
                    updatedList = members.map(m => {
                        if (updatedMember.ids.includes(m.id)) {
                             const { ids, isBulk, ...changes } = updatedMember;
                             return { ...m, ...changes };
                        }
                        return m;
                    });
                } else {
                    updatedList = members.map(m => m.id === updatedMember.id ? { ...m, ...updatedMember, image: m.image } : m);
                }
                setMembers(updatedList);
            };

            const handleAdminLogin = (username, password) => {
                if (username === 'admin' && password === 'admin') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                } else {
                    alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
                }
            };

            const handleAdminLogout = () => {
                setIsAdmin(false);
            };

            const handleAdminLogoutClick = () => { setShowAdminLogoutConfirm(true); };
            const confirmAdminLogout = () => { setIsAdmin(false); setShowAdminLogoutConfirm(false); };

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen} isCollapsed={isSidebarCollapsed} toggleCollapse={toggleSidebar} isAdmin={isAdmin} onAdminClick={isAdmin ? handleAdminLogoutClick : () => setShowAdminLogin(true)} />
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="bg-white shadow-sm p-4 flex items-center justify-between lg:hidden z-10">
                            <button onClick={() => setMobileMenuOpen(true)} className="text-gray-600"><i className="fa-solid fa-bars text-xl"></i></button>
                            <span className="font-bold text-gray-800">YEC Lamphun</span>
                            <div className="w-8"></div>
                        </header>
                        <main className="flex-1 overflow-y-auto p-4 lg:p-8 pb-20">
                            <div className="max-w-7xl mx-auto">
                                {activeTab === 'dashboard' && <Dashboard members={members} onSearchClick={() => setActiveTab('members')} isAdmin={isAdmin} />} {/* Passed isAdmin */}
                                {activeTab === 'org' && <OrgChart members={members} />}
                                {activeTab === 'members' && <MemberSystem members={members} onAddMember={handleAddMember} onUpdateMember={handleUpdateMember} onDeleteMember={handleDeleteMember} isAdmin={isAdmin} />}
                                {activeTab === 'renewal' && <MembershipRenewal members={members} onUpdateMember={handleUpdateMember} isAdmin={isAdmin} />}
                            </div>
                        </main>
                    </div>
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm animate-fade-in relative">
                                <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i className="fa-solid fa-xmark text-xl"></i></button>
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3 text-blue-600 text-2xl"><i className="fa-solid fa-user-shield"></i></div>
                                    <h3 className="text-xl font-bold text-gray-800">ผู้ดูแลระบบ</h3>
                                    <p className="text-sm text-gray-500">กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูล</p>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); handleAdminLogin(e.target.username.value, e.target.password.value); }}>
                                    <div className="space-y-4">
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้</label><div className="relative"><span className="absolute left-3 top-2.5 text-gray-400"><i className="fa-solid fa-user"></i></span><input type="text" name="username" className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Username" required /></div></div>
                                        <div><label className="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label><div className="relative"><span className="absolute left-3 top-2.5 text-gray-400"><i className="fa-solid fa-lock"></i></span><input type="password" name="password" className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Password" required /></div></div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-sm transition">เข้าสู่ระบบ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    {showAdminLogoutConfirm && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm animate-fade-in relative text-center">
                                <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl"><i className="fa-solid fa-right-from-bracket"></i></div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">ยืนยันการออกจากระบบ</h3>
                                <p className="text-gray-500 mb-6 text-sm">คุณต้องการออกจากโหมดผู้ดูแลระบบใช่หรือไม่?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowAdminLogoutConfirm(false)} className="flex-1 py-2.5 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition font-medium">ยกเลิก</button>
                                    <button onClick={confirmAdminLogout} className="flex-1 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-md transition font-medium">ออกจากระบบ</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
